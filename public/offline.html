<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16c7b7" />
    <title>CleanCity+ Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef4f7;
        --ink: #101a26;
        --muted: #667385;
        --teal: #16c7b7;
        --lime: #b7f46e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 12%, rgba(22, 199, 183, 0.22), transparent 30%),
          linear-gradient(135deg, #f8fbfc 0%, var(--bg) 60%, #e7eef3 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(620px, 100%);
        padding: clamp(24px, 6vw, 44px);
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 22px 70px rgba(18, 35, 54, 0.12);
      }

      img {
        width: 64px;
        height: 64px;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(38px, 8vw, 64px);
        line-height: 0.94;
      }

      p {
        color: var(--muted);
        font-size: 18px;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        margin-top: 10px;
        padding: 0 18px;
        border-radius: 8px;
        color: #041f1c;
        background: linear-gradient(135deg, var(--teal), var(--lime));
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>CleanCity+ is offline</h1>
      <p>
        Your saved logs and pledges stay on this device. Reconnect to refresh the app, then keep tracking your recycling impact.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
